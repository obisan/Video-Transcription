version: '3.8'

services:
  app:
    build: .
    container_name: video-transcription
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    environment:
      - OLLAMA_API_BASE=http://host.docker.internal:11434
      - DEFAULT_MODEL=qwen3.8:latest
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_MAX_UPLOAD_SIZE=10240
      - STREAMLIT_SERVER_MAX_MESSAGE_SIZE=10240
      - DATABASE_PATH=/app/data/transcription.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s